<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FF6B6B">
<meta name="dice-split-temporary" content="__TEMPORARY_MODE__">
<title>骰子分账 🎲</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<style>
  :root {
    --bg: #FBF6EF;
    --card: #FFFFFF;
    --ink: #3D3229;
    --sub: #9C8E80;
    --brand: #FF6B6B;
    --brand2: #FF8E53;
    --mint: #35B8A6;
    --line: #F0E7DB;
    --danger: #E25555;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; min-height: 100dvh;
  }
  #app { max-width: 430px; margin: 0 auto; padding: 16px 16px calc(28px + env(safe-area-inset-bottom)); }

  .logo { text-align: center; padding: 40px 0 8px; }
  .logo .big { font-size: 64px; display: block; animation: wobble 3.2s ease-in-out infinite; }
  @keyframes wobble { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  .logo h1 { font-size: 26px; letter-spacing: 2px; margin-top: 8px; }
  .logo p { color: var(--sub); font-size: 14px; margin-top: 6px; }

  .card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(90,60,30,.06); margin-top: 16px; }
  .temporary-notice { margin-top: 16px; padding: 14px 16px; border: 1px solid #EDC498; border-left: 4px solid #B86B29;
    border-radius: 14px; background: #FFF3DF; color: #74451F; font-size: 12px; line-height: 1.7; }
  .temporary-notice strong { display: block; font-size: 14px; margin-bottom: 4px; }
  .tabs { display: flex; background: #F4EDE2; border-radius: 14px; padding: 4px; margin-bottom: 16px; }
  .tabs button { flex: 1; border: 0; background: transparent; padding: 10px; border-radius: 11px; font-size: 15px; font-weight: 600; color: var(--sub); }
  .tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); }

  label { display: block; font-size: 13px; color: var(--sub); margin: 14px 2px 6px; font-weight: 600; }
  input[type=text], input[type=tel] {
    width: 100%; border: 2px solid var(--line); border-radius: 14px; padding: 13px 14px;
    font-size: 17px; background: #FFFDF9; color: var(--ink); outline: none; transition: border-color .15s;
  }
  input:focus { border-color: var(--brand); }

  .avatars { display: flex; gap: 6px; flex-wrap: wrap; }
  .avatars button {
    width: 44px; height: 44px; font-size: 24px; border-radius: 14px; border: 2px solid transparent;
    background: #F7F1E8; cursor: pointer; transition: all .12s;
  }
  .avatars button.on { border-color: var(--brand); background: #FFEFEA; transform: scale(1.08); }

  .btn {
    display: block; width: 100%; border: 0; border-radius: 16px; padding: 15px;
    font-size: 17px; font-weight: 700; cursor: pointer; color: #fff; margin-top: 18px;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    box-shadow: 0 6px 16px rgba(255,107,107,.35); transition: transform .1s, opacity .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn[disabled] { opacity: .45; box-shadow: none; }
  .btn.ghost { background: #fff; color: var(--brand); border: 2px solid var(--brand); box-shadow: none; }
  .btn.plain { background: #F1E9DD; color: var(--sub); box-shadow: none; }
  .btn.danger { background: #fff; color: var(--danger); border: 2px solid var(--danger); box-shadow: none; }
  .btn.small { padding: 10px 14px; font-size: 14px; width: auto; margin-top: 0; border-radius: 12px; }

  /* ---- 房间页 ---- */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding-top: 6px; }
  .topbar .title { font-size: 20px; font-weight: 800; }
  .iconbtn { border: 0; background: #fff; width: 40px; height: 40px; border-radius: 13px; font-size: 19px;
    box-shadow: 0 3px 10px rgba(90,60,30,.08); cursor: pointer; }

  .roomcard { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .code { font-size: 24px; font-weight: 800; letter-spacing: 4px; color: var(--brand); }
  .players { display: flex; gap: 8px; }
  .player { text-align: center; min-width: 64px; }
  .player .face { font-size: 34px; position: relative; }
  .player .dot { position: absolute; right: 2px; bottom: 2px; width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid #fff; background: #CCC; }
  .player .dot.on { background: #4CD964; }
  .player .name { font-size: 12px; color: var(--sub); margin-top: 3px; max-width: 72px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .vs { color: var(--sub); font-size: 13px; font-weight: 700; align-self: center; margin-top: -14px; }

  .settle { text-align: center; padding: 18px 16px; }
  .settle .k { font-size: 13px; color: var(--sub); font-weight: 600; }
  .settle .v { font-size: 30px; font-weight: 800; margin-top: 6px; }
  .settle .v.in { color: var(--mint); }
  .settle .v.out { color: var(--brand); }
  .settle .sub { font-size: 13px; color: var(--sub); margin-top: 6px; line-height: 1.5; }
  .stats { display: flex; border-top: 1px dashed var(--line); margin-top: 14px; padding-top: 14px; }
  .stats > div { flex: 1; text-align: center; }
  .stats .n { font-size: 17px; font-weight: 800; }
  .stats .l { font-size: 11px; color: var(--sub); margin-top: 3px; }

  .empty { text-align: center; color: var(--sub); font-size: 14px; padding: 10px 0 4px; line-height: 1.7; }

  /* ---- 掷骰区 ---- */
  .billhead { text-align: center; }
  .billhead .amt { font-size: 40px; font-weight: 800; }
  .billhead .note { color: var(--sub); font-size: 14px; margin-top: 4px; }
  .hint { text-align: center; color: var(--sub); font-size: 13px; margin-top: 10px; }

  .dicezone { display: flex; align-items: stretch; justify-content: center; gap: 14px; margin-top: 16px; }
  .diebox { flex: 1; max-width: 150px; text-align: center; background: #FFF9F1; border: 2px dashed var(--line);
    border-radius: 18px; padding: 14px 8px; }
  .diebox .die { font-size: 58px; line-height: 1.15; min-height: 66px; }
  .diebox .who { font-size: 12px; color: var(--sub); font-weight: 600; }
  .diebox.rolled-ok { border-style: solid; border-color: #FFD9CC; background: #FFF3EC; }
  .die.rolling { animation: shake .28s linear infinite; }
  @keyframes shake { 0%{transform:rotate(-14deg) scale(1.04)} 50%{transform:rotate(14deg) scale(1.12)} 100%{transform:rotate(-14deg) scale(1.04)} }
  .die.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 0%{transform:scale(.2) rotate(-30deg); opacity:0} 100%{transform:scale(1) rotate(0); opacity:1} }
  /* 超过 6 点（8/10/12/20 面骰）没有 Unicode 骰面，用数字方片表示 */
  .dnum { display: inline-flex; align-items: center; justify-content: center; width: 62px; height: 62px;
    border: 4px solid var(--ink); border-radius: 14px; font-size: 28px; font-weight: 800; vertical-align: middle; }
  .hitem .dice .dnum { width: 20px; height: 20px; border-width: 2px; border-radius: 5px; font-size: 11px; }

  .ratio { text-align: center; font-size: 34px; font-weight: 800; margin-top: 14px; letter-spacing: 1px; }
  .ratio .av { font-size: 22px; }
  .shares { display: flex; gap: 10px; margin-top: 12px; }
  .shares > div { flex: 1; text-align: center; border-radius: 16px; padding: 12px 6px; }
  .shares .s1 { background: #FFF3EC; }
  .shares .s2 { background: #EAF7F4; }
  .shares .m { font-size: 22px; font-weight: 800; margin-top: 2px; }

  .confirmline { text-align: center; font-size: 13px; color: var(--sub); margin-top: 12px; min-height: 18px; }
  .confirmline b.ok { color: var(--mint); }

  /* ---- 历史 ---- */
  .h2 { font-size: 16px; font-weight: 800; margin: 26px 4px 10px; display: flex; justify-content: space-between; align-items: center; }
  .h2 span { font-size: 12px; color: var(--sub); font-weight: 500; }
  .hitem { display: flex; align-items: center; gap: 12px; padding: 13px 14px; }
  .hitem .dice { font-size: 20px; letter-spacing: 1px; }
  .hitem .mid { flex: 1; min-width: 0; }
  .hitem .t { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hitem .d { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .hitem .right { text-align: right; }
  .hitem .sum { font-size: 16px; font-weight: 800; }
  .hitem .mine { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .hitem .del { border: 0; background: none; color: #9C8E80; font-size: 15px; padding: 12px; cursor: pointer; }
  .hitem .del:disabled { opacity: .35; cursor: default; }
  .ledger-request { border: 2px solid #FFD9CC; }
  .ledger-request h3 { font-size: 17px; }
  .ledger-request p { font-size: 14px; color: var(--sub); line-height: 1.7; margin-top: 8px; overflow-wrap: anywhere; }
  .repayment-tag { color: var(--mint); background: #EAF7F4; border-radius: 12px; padding: 12px 8px; font-size: 13px; font-weight: 700; }
  .rr { display: inline-block; font-size: 10px; background: #F4EDE2; color: var(--sub); border-radius: 6px; padding: 1px 5px; margin-left: 5px; }

  /* ---- 模态 / toast ---- */
  #modal-root:empty { display: none; }
  .mask { position: fixed; inset: 0; background: rgba(61,50,41,.45); z-index: 50; display: flex;
    align-items: flex-end; justify-content: center; animation: fade .18s; }
  @keyframes fade { from { opacity: 0; } }
  .sheet { background: var(--bg); width: 100%; max-width: 430px; max-height: 90dvh; overflow-y: auto; border-radius: 24px 24px 0 0;
    padding: 20px 18px calc(24px + env(safe-area-inset-bottom)); animation: up .22s cubic-bezier(.2,.9,.3,1); }
  @keyframes up { from { transform: translateY(60%); } }
  .sheet h3 { text-align: center; font-size: 17px; margin-bottom: 4px; }
  .sheet .x { position: absolute; }
  .amt-input { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin: 10px 0 2px; }
  .amt-input input { border: 0; background: transparent; text-align: center; font-size: 48px; font-weight: 800;
    width: 100%; outline: none; color: var(--ink); }
  .amt-input .yen { font-size: 26px; font-weight: 800; color: var(--brand); }
  .chips { display: flex; gap: 8px; }
  #s-faces { display: grid; grid-template-columns: repeat(3, 1fr); }
  .chips button { flex: 1; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 11px;
    font-size: 15px; font-weight: 700; color: var(--sub); cursor: pointer; }
  .chips button.on { border-color: var(--brand); color: var(--brand); background: #FFF3EC; }
  .sheet .btn { margin-top: 16px; }

  #toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 99;
    background: rgba(61,50,41,.92); color: #fff; font-size: 14px; padding: 10px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 80vw; text-align: center; }
  #toast.show { opacity: 1; }

  .fadein { animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } }

  #app.room-view { max-width: 800px; padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
  .topbar .room-code { margin-top: 4px; color: var(--sub); font-size: 12px; letter-spacing: 1px; }
  .room-nav { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 20;
    width: 100%; max-width: 800px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: #FFFCF8;
    border-top: 1px solid var(--line); box-shadow: 0 -4px 24px rgba(90,60,30,.06); }
  .room-nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    min-height: 58px; border: 0; border-radius: 14px; background: transparent; color: var(--sub);
    font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .room-nav button[aria-current=page] { background: #FFEDE4; color: #A83F35; }
  .nav-status { font-size: 11px; font-weight: 500; line-height: 16px; }
  .nav-status.attention { background: #A83F35; color: #fff; border-radius: 10px; padding: 0 7px; }
  .page-prompt { border: 1px solid var(--line); }
  .page-prompt h2 { font-size: 18px; }
  .page-prompt p { margin-top: 8px; color: var(--sub); font-size: 13px; line-height: 1.7; }
  .page-prompt.saved { border-color: #B9DED6; background: #F0FAF6; }
  .temporary-notice.compact { padding: 4px 12px; }
  .temporary-notice summary { color: #74451F; font-size: 12px; font-weight: 600; }
  .temporary-notice .notice-detail { padding: 0 0 8px; }
  :root { --sub: #796B5D; }
  button, input, select, summary { touch-action: manipulation; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 3px solid var(--mint); outline-offset: 3px;
  }
  button:disabled { cursor: not-allowed; }
  select { width: 100%; min-height: 48px; padding: 12px; border: 2px solid var(--line); border-radius: 14px;
    background: #FFFDF9; color: var(--ink); font: inherit; }
  .roomcard { display: block; }
  .room-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .room-heading .hint { text-align: left; margin-top: 4px; }
  .room-heading .title { font-size: 16px; }
  .players { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 10px; margin-top: 18px; }
  .player { min-width: 0; padding: 10px 4px; background: #FFF9F1; border-radius: 14px; }
  .player .name { max-width: none; white-space: normal; overflow-wrap: anywhere; color: var(--ink); }
  .player .status { margin-top: 4px; font-size: 11px; color: var(--sub); }
  .player .face { display: inline-block; }
  .dicezone, .shares, .member-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .diebox { max-width: none; min-width: 0; }
  .who, .billhead .note, .confirmline, .hint { overflow-wrap: anywhere; line-height: 1.65; }
  .shares > div { min-width: 0; }
  .shares .m { font-size: 21px; font-variant-numeric: tabular-nums; }
  .ratio { font-size: 20px; overflow-wrap: anywhere; }
  .stats { flex-wrap: wrap; gap: 14px 8px; }
  .stats > div { min-width: 100px; }
  .member-stats { margin-top: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .member-stat { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: #FFFDF9; min-width: 0; }
  .member-stat h3 { font-size: 14px; overflow-wrap: anywhere; }
  .member-stat dl { margin-top: 10px; font-size: 13px; }
  .member-stat dl > div { display: flex; justify-content: space-between; gap: 10px; margin-top: 7px; }
  .member-stat dt { color: var(--sub); }
  .member-stat dd { text-align: right; font-variant-numeric: tabular-nums; }
  .member-stat .net { padding-top: 9px; border-top: 1px dashed var(--line); font-weight: 700; }
  .in { color: #178574; } .out { color: #C34747; }
  .recovery-reminder { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 16px; padding: 12px 16px; border: 1px solid #EDC498; border-radius: 14px; background: #FFF3DF; }
  .recovery-reminder p { font-size: 12px; line-height: 1.6; flex: 1; min-width: 180px; }
  .recovery-code { font-family: ui-monospace, monospace; font-size: 15px !important; letter-spacing: 1px; }
  .button-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .button-row .btn { flex: 1; margin: 0; min-width: 110px; }
  .history-card { padding: 0; overflow: hidden; }
  .history-card .hitem { flex-wrap: wrap; }
  .history-card details { padding: 0 14px 14px; }
  summary { cursor: pointer; color: var(--sub); font-size: 13px; padding: 8px 0; }
  .history-card .shares { margin-top: 5px; }
  .history-card .shares .m { font-size: 16px; }
  .history-card .dice { margin-top: 5px; }
  fieldset { border: 0; margin-top: 16px; min-width: 0; }
  legend { color: var(--sub); font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .participant-picker { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .participant-picker label { display: flex; align-items: center; gap: 8px; margin: 0; padding: 12px 10px;
    background: #fff; border: 2px solid var(--line); border-radius: 14px; color: var(--ink); overflow-wrap: anywhere; }
  .participant-picker label:has(input:checked) { border-color: var(--brand); background: #FFF3EC; }
  input[type=checkbox] { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--brand); }
  .sheet { max-width: 520px; }
  .sheet h4 { margin-top: 20px; font-size: 15px; }
  .progress { margin-top: 12px; font-size: 13px; line-height: 1.7; color: var(--sub); overflow-wrap: anywhere; }
  .progress strong { color: var(--ink); }
  .die.waiting { display: grid; place-items: center; font-size: 24px; }
  @media (max-width: 360px) {
    .card { padding: 16px; }
    .dicezone, .shares { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .history-card { padding: 0; }
    .topbar .title { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main id="app"></main>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============ 基础状态 ============ */
const AVATARS = ['🐻','🐱','🐼','🦊','🐯','🐨','🐰','🦁','🐸','🐷'];
const $app = document.getElementById('app');
const $modal = document.getElementById('modal-root');
let temporaryMode = document.querySelector('meta[name="dice-split-temporary"]').content === 'true';
const staleMessage = () => temporaryMode ? '临时房间已销毁或身份已失效，请重新开房或加入' : '身份已失效，请重新进入房间';
function temporaryNotice(compact = false) {
  if (!temporaryMode) return '';
  const detail = `房间内容仅在内存中，不保存到磁盘。最后一人断开或服务重启后，房间及全部记录立即销毁。<br>
    分账仅留最近一笔，新分账经开掷时所有成员确认后替换旧分账及其还款；还款明细只留最新一条，省略明细按每位成员的还款净额保留。<br>
    独自刷新或关闭页面也可能销毁房间；已销毁的房间无法用恢复码找回。公网使用仍建议设置密码。`;
  return compact ? `<details class="temporary-notice compact" id="room-notice" ${noticeExpanded ? 'open' : ''}>
    <summary>临时模式 · 仅留最近一笔 · 无人在线即销毁</summary>
    <div class="notice-detail">目前未设置密码。${detail}</div>
  </details>` : `<aside class="temporary-notice" role="note" aria-label="无密码临时模式提示">
    <strong>目前未设置密码 · 临时模式</strong>${detail}
  </aside>`;
}

const ME_KEY = 'dice-split-me';
let me = null;            // { code, token, role }
try { me = JSON.parse(localStorage.getItem(ME_KEY) || 'null'); } catch (e) { me = null; }
let room = null;          // 服务器快照
let roomPage = 'dice';
let pageScroll = { dice: 0, ledger: 0 };
let noticeExpanded = false;
let recentRecordedId = null;
let es = null;            // EventSource
let connectAttempt = 0;
let connectTimer = null;
let rollAnimUntil = 0;    // 本地掷骰动画截止时间
let animTimer = null;
let myLocalRoll = null;   // rolling 阶段自己的点数（服务器只发响应给本人，不进广播）
let lastPhaseKey = '';    // 用于识别"新一笔开始"，避免误关正在输入的弹层

// URL 认领: #t=<token>&c=<CODE> —— 换手机 / 测试用
(function readHash() {
  const h = location.hash.slice(1);
  if (!h) return;
  const q = new URLSearchParams(h.includes('=') ? h : 'c=' + h);
  const t = q.get('t'), c = (q.get('c') || '').toUpperCase();
  if (t && c && q.get('r')) {
    me = { code: c, token: t, role: q.get('r') };
    localStorage.setItem(ME_KEY, JSON.stringify(me));
    history.replaceState(null, '', location.pathname);
  } else if (c && !t) {
    window.__presetCode = c; // 邀请链接，仅预填房间码
  }
})();

function saveMe() { localStorage.setItem(ME_KEY, JSON.stringify(me)); }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}
const fmt = (cents) => (cents / 100).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let passcode = localStorage.getItem('dice-split-pass') || '';

// 口令弹窗：服务端要求口令时出现，输入后自动重试原请求
function askPasscode() {
  return new Promise((resolve) => {
    $modal.innerHTML = `
      <div class="mask" id="mask">
        <div class="sheet">
          <h3>🔒 这台服务器设置了口令</h3>
          <p style="text-align:center;color:var(--sub);font-size:13px;margin:6px 0 4px">问搭子或服务器主人要口令</p>
          <input type="text" id="pc-input" placeholder="输入口令" style="text-align:center" autocomplete="off">
          <button class="btn" id="pc-go">确定</button>
        </div>
      </div>`;
    const input = document.getElementById('pc-input');
    setTimeout(() => input.focus(), 200);
    const done = () => {
      passcode = input.value.trim();
      localStorage.setItem('dice-split-pass', passcode);
      $modal.innerHTML = '';
      resolve(passcode);
    };
    document.getElementById('pc-go').addEventListener('click', done);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') done(); });
  });
}

async function api(path, body) {
  const r = await fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...(body || {}), passcode }),
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && data.error === 'need-passcode') {
    const pc = await askPasscode();
    if (!pc) throw new Error('需要口令才能使用');
    return api(path, body);
  }
  if (!r.ok) {
    if (data.error === 'stale') { leaveRoom(staleMessage()); throw new Error(staleMessage()); }
    throw new Error(data.error || '请求失败');
  }
  return data;
}

/* ============ SSE ============ */
async function connect(retryDelay = 1000) {
  const attempt = ++connectAttempt;
  clearTimeout(connectTimer);
  if (es) { es.close(); es = null; }
  if (!me) return;
  const retry = (message) => {
    if (attempt !== connectAttempt) return;
    toast(message);
    connectTimer = setTimeout(() => connect(Math.min(retryDelay * 2, 30000)), retryDelay);
  };
  const qs = `code=${encodeURIComponent(me.code)}&token=${encodeURIComponent(me.token)}&passcode=${encodeURIComponent(passcode)}`;
  try {
    const ping = await fetch(`/api/ping?${qs}`, { signal: AbortSignal.timeout(10000) });
    if (attempt !== connectAttempt) return;
    if (!ping.ok) {
      const d = await ping.json().catch(() => ({}));
      if (attempt !== connectAttempt) return;
      if (ping.status === 401 && d.error === 'stale') { leaveRoom(staleMessage()); return; }
      if (ping.status === 401 && d.error === 'need-passcode') {
        const pc = await askPasscode();
        if (attempt !== connectAttempt) return;
        if (pc) return connect();
        leaveRoom(); return;
      }
      retry(ping.status === 429 ? '请求太频繁，正在稍后自动重试' : '连接暂不可用，正在自动重试');
      return;
    }
  } catch (e) {
    retry('网络暂不可用，正在自动重试');
    return;
  }
  const stream = es = new EventSource(`/events?${qs}`);
  stream.onmessage = (ev) => {
    if (es !== stream) return;
    const snap = JSON.parse(ev.data);
    if (snap.error === 'stale') { leaveRoom(staleMessage()); return; }
    const latest = snap.history[0];
    if (room && latest && !room.history.some((h) => h.id === latest.id)) {
      recentRecordedId = latest.id;
      toast('分账已确认，已记入账本');
    }
    if (snap.bill || !snap.history.some((h) => h.id === recentRecordedId)) recentRecordedId = null;
    room = snap;
    temporaryMode = snap.temporaryMode;
    // 掷骰进行中且自己尚未掷（新的一笔 / 被重掷），清掉本地暂存点数
    if (room.phase === 'rolling' && room.bill && !room.bill.rolled[me.role]) myLocalRoll = null;
    render();
  };
  stream.onerror = async () => {
    try {
      const response = await fetch(`/api/ping?${qs}`, { signal: AbortSignal.timeout(10000) });
      const data = await response.json();
      if (es === stream && response.status === 401 && data.error === 'stale') leaveRoom(staleMessage());
    } catch (e) { /* 网络恢复后仍由 EventSource 自动重连。 */ }
  };
}
function leaveRoom(msg) {
  connectAttempt++;
  clearTimeout(connectTimer);
  if (es) { es.close(); es = null; }
  me = null; room = null;
  myLocalRoll = null;
  rollAnimUntil = 0;
  clearTimeout(animTimer);
  lastPhaseKey = '';
  roomPage = 'dice';
  pageScroll = { dice: 0, ledger: 0 };
  noticeExpanded = false;
  recentRecordedId = null;
  expandedHistory.clear();
  closeModal();
  localStorage.removeItem(ME_KEY);
  render();
  if (msg) toast(msg);
}

/* ============ 房间页 ============ */
function myRole() { return me && me.role; }
function memberIds() { return Object.keys(room.players).filter((id) => room.players[id]); }
function ph(p, id = '') { return p ? `${esc(p.avatar)} ${esc(p.name)}` : esc(id || '待加入'); }
function memberName(id) { return room.players[id]?.name || id; }
function names(ids) { return ids.map((id) => esc(memberName(id))).join('、'); }
function participantsOf(record) { return record.participants || Object.keys(record.shares || {}); }
function ledgerBusy() { return room.phase !== 'idle' || !!room.bill || !!room.ledgerPending; }
// 1–6 点用骰面字符，更多点数用数字骰面；旁观者没有点数。
function dieGlyph(n) {
  if (!Number.isInteger(n) || n < 1) return '—';
  return n <= 6 ? '⚀⚁⚂⚃⚄⚅'[n - 1] : `<span class="dnum">${esc(n)}</span>`;
}
function netText(net) { return net > 0 ? `应收 ¥ ${fmt(net)}` : net < 0 ? `应付 ¥ ${fmt(-net)}` : '已两清'; }
function repaidText(net) { return net > 0 ? `净还出 ¥ ${fmt(net)}` : net < 0 ? `净收回 ¥ ${fmt(-net)}` : '¥ 0.00'; }
function luckText(st) {
  return !st.n ? '尚未参与' : Math.abs(st.luck) < 0.005 ? '刚好均摊'
    : st.luck > 0 ? `多担 ¥ ${fmt(st.luck)}` : `少担 ¥ ${fmt(-st.luck)}`;
}

// 还款 carry 是净流出（正）/净流入（负），不可当作历史还款总额。
function calcStats() {
  const ids = memberIds();
  const byMember = Object.fromEntries(ids.map((id) => [id, {
    paid: 0, share: 0, repaid: room.repaymentCarry?.[id] || 0,
    carry: room.repaymentCarry?.[id] || 0, luck: 0, n: 0, net: room.balance?.[id] || 0,
  }]));
  let total = 0;
  for (const h of room.history) {
    total += h.amountCents;
    if (byMember[h.payer]) byMember[h.payer].paid += h.amountCents;
    const participants = participantsOf(h);
    for (const id of participants) {
      const st = byMember[id];
      if (!st) continue;
      const share = h.shares?.[id] || 0;
      st.share += share;
      st.luck += share - h.amountCents / participants.length;
      st.n++;
    }
  }
  for (const p of room.repayments) {
    if (byMember[p.from]) byMember[p.from].repaid += p.amountCents;
    if (byMember[p.to]) byMember[p.to].repaid -= p.amountCents;
  }
  return { total, byMember };
}

function progressHtml(label, required, approvals = {}) {
  const waiting = required.filter((id) => !approvals[id]);
  return `<div class="progress" role="status"><strong>${esc(label)} ${required.length - waiting.length}/${required.length}</strong><br>
    ${waiting.length ? `等待：${names(waiting)}` : '已全部确认，正在同步…'}</div>`;
}
function proposalHtml(pd, prefix, detail, approveLabel) {
  const required = pd.required || [], mine = pd.by === myRole();
  const eligible = required.includes(myRole()) && !pd.approvals?.[myRole()] && !mine;
  return `<div class="card ledger-request" role="region" aria-label="待确认提议">
    <h3>${mine ? '你' : esc(memberName(pd.by))}发起的提议</h3>
    <p>${detail}</p>
    ${progressHtml('已同意', required, pd.approvals)}
    ${!required.includes(myRole()) ? '<p>本次无需你确认，仅供查看。</p>' : ''}
    ${eligible ? `<button class="btn" id="${prefix}-approve">${esc(approveLabel)}</button>
      <button class="btn ghost" id="${prefix}-reject">不同意，取消提议</button>` : ''}
    ${mine ? `<button class="btn plain" id="${prefix}-withdraw">撤回提议</button>` : ''}
  </div>`;
}
const expandedHistory = new Set();

function roomPageStatus(page) {
  const r = myRole();
  const pending = page === 'dice' ? room.bill?.pending : room.ledgerPending;
  if (pending) return pending.by !== r && pending.required.includes(r) && !pending.approvals?.[r] ? '待确认' : '进行中';
  if (page !== 'dice' || !room.bill) return '';
  const b = room.bill;
  if (room.phase === 'rolling' && participantsOf(b).includes(r) && !b.rolled?.[r] && Date.now() >= rollAnimUntil) return '待掷骰';
  if (room.phase === 'result' && (b.required || participantsOf(b)).includes(r) && !b.confirms?.[r]) return '待确认';
  return '进行中';
}

function switchRoomPage(page, scrollTop = false) {
  if (page === roomPage) return;
  pageScroll[roomPage] = window.scrollY;
  roomPage = page;
  renderRoom(scrollTop ? 0 : pageScroll[page]);
  document.getElementById(`nav-${page}`).focus({ preventScroll: true });
}

function fmtTime(ts) {
  const d = new Date(ts), now = new Date();
  const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return `今天 ${hm}`;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return `昨天 ${hm}`;
  return `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
}

    ${[p.from, p.to].includes(r) ? `<button class="del" data-del-repayment="${esc(p.id)}" aria-label="提议删除还款记录" ${busy ? 'disabled' : ''}>×</button>` : ''}
  </div>`).join('');

  let ledgerHtml = '';
  const pending = room.ledgerPending;
  if (pending) {
    let detail, approveLabel;
    if (pending.type === 'repay') {
      detail = `${ph(P[pending.from], pending.from)} → ${ph(P[pending.to], pending.to)} · ¥ ${fmt(pending.amountCents)}<br>请核实实际转账，仅付款人与收款人确认后才抵扣余额。`;
      approveLabel = pending.to === r ? '确认已收到这笔还款' : '确认已支付这笔还款';
    } else if (pending.type === 'clearHistory') {
      detail = `清空 ${room.history.length} 笔消费、${room.repayments.length} 条还款明细及已省略还款净额，余额归零。需所有成员同意，确认后不可恢复。`;
      approveLabel = '同意清空全部记录';
    } else if (pending.type === 'deleteHistory') {
      const h = room.history.find((h) => h.id === pending.historyId);
      detail = `删除消费：${esc(h?.note || '未备注消费')} · ¥ ${fmt(h?.amountCents || 0)}<br>需所有成员同意。${temporaryMode ? '同时清理这笔分账的还款与还款净额汇总，余额归零。' : '重算余额，但不撤销已经发生的转账。'}`;
      approveLabel = '同意删除这笔消费';
    } else {
      const p = room.repayments.find((p) => p.id === pending.repaymentId) || pending;
      detail = `删除还款：${ph(P[p.from], p.from)} → ${ph(P[p.to], p.to)} · ¥ ${fmt(p.amountCents || 0)}<br>仅付款人与收款人确认。撤销这笔还款的余额抵扣，不撤销实际转账。`;
      approveLabel = '同意删除这笔还款';
    }
    ledgerHtml = proposalHtml(pending, 'l', detail, approveLabel);
  }

  $app.classList.add('room-view');
  $app.innerHTML = `
    <header class="topbar"><div><h1 class="title">${roomPage === 'dice' ? '投骰子分账' : '记账汇总'}</h1>
      <p class="room-code">房间 ${esc(room.code)} · ${ids.length}/${esc(room.capacity || 2)} 人</p></div>
      <button class="btn plain small" id="a-settings" aria-label="打开设置与个人恢复码">设置</button></header>
    ${temporaryNotice(true)}
    <div id="room-page">
    ${roomPage === 'dice' ? `
    <section class="card roomcard" aria-label="房间成员">
      <div class="room-heading"><div><h2 class="title">房间成员</h2>
        <p class="hint">${ids.filter((id) => P[id].online).length} 人在线 · ${esc(room.faces || 6)} 面骰</p></div>
        ${ids.length < (room.capacity || 2) ? '<button class="btn small" id="a-invite">邀请朋友</button>' : '<span class="hint">房间已满</span>'}
      </div>
      <div class="players">${ids.map((id) => {
        const p = P[id];
        return `<div class="player"><div class="face">${esc(p.avatar)}<span class="dot ${p.online ? 'on' : ''}" aria-hidden="true"></span></div>
          <div class="name">${esc(p.name)}${id === r ? '（我）' : ''}</div><div class="status">${esc(id)} · ${p.online ? '在线' : '离线'}</div></div>`;
      }).join('')}</div>
      ${ids.length < 2 ? '<p class="hint">再来一位就能开掷。发出邀请，让朋友入座吧。</p>' : ''}
    </section>
    ${pending ? `<section class="card page-prompt" aria-label="账本操作提醒">
      <h2>先处理账本提议</h2><p>有还款或账本操作尚未确认，处理完成后才能发起新的分账。</p>
      <button class="btn ghost" id="a-ledger-pending">前往记账汇总处理</button>
    </section>` : ''}
    ${billHtml}
    ${!busy && ids.length >= 2 ? `<section class="card page-prompt ${recentRecordedId ? 'saved' : ''}" aria-label="发起分账">
      <h2>${recentRecordedId ? '这笔分账已入账' : '这一笔，让骰子决定'}</h2>
      <p>${recentRecordedId ? '本笔所需成员已确认，分摊结果已同步到记账汇总。' : '填好金额、选好参与者，一起掷骰决定各自承担多少。'}</p>
      <button class="btn" id="a-new">发起分账</button>
      ${recentRecordedId ? '<button class="btn ghost" id="a-view-ledger">查看记账汇总</button>' : ''}
    </section>` : ''}
    ` : `
    ${ledgerHtml}
    ${room.bill ? `<section class="card page-prompt" aria-label="分账操作提醒">
      <h2>有一笔分账进行中</h2><p>本笔确认入账前，余额保持不变，暂时不能还款或修改账本。</p>
      <button class="btn ghost" id="a-dice-pending">返回投骰子分账</button>
    </section>` : ''}
    <section class="card settle" aria-label="我的结算">
      <div class="k">${net > 0 ? '我还应收回' : net < 0 ? '我还需要支付' : room.history.length ? '我的余额已两清' : '还没有消费记录'}</div>
      <div class="v ${net > 0 ? 'in' : net < 0 ? 'out' : ''}">¥ ${fmt(Math.abs(net))}</div>
      <div class="sub">以每笔参与者均摊为基准，我的手气：${luckText(st)}</div>
      ${room.repayments.length || hasCarry ? '<div class="sub">余额已计入所有确认的还款净额</div>' : ''}
      ${net !== 0 ? `<button class="btn ghost small" id="a-repay" style="margin:14px auto 0" ${busy ? 'disabled' : ''}>记录还款 / 部分结清</button>` : ''}
      <div class="stats"><div><div class="n">${st.n}</div><div class="l">我参与的笔数</div></div>
        <div><div class="n">¥ ${fmt(stats.total)}</div><div class="l">房间总消费</div></div>
        <div><div class="n">¥ ${fmt(st.paid)}</div><div class="l">我垫付</div></div>
        <div><div class="n">¥ ${fmt(st.share)}</div><div class="l">我承担</div></div></div>
    </section>
    <div class="h2">大家的账 <span>按成员汇总 · 实时同步</span></div>
    <p class="hint">还款净额 = 已还出 − 已收回；正数抵扣应付，负数抵扣应收。不是累计转账总额。</p>
    <div class="member-stats">${ids.map((id) => {
      const s = stats.byMember[id];
      return `<section class="member-stat"><h3>${ph(P[id], id)}${id === r ? '（我）' : ''}</h3><dl>
        <div><dt>承担 · ${s.n} 笔</dt><dd>¥ ${fmt(s.share)}</dd></div>
        <div><dt>垫付</dt><dd>¥ ${fmt(s.paid)}</dd></div>
        <div><dt>还款净额</dt><dd>${repaidText(s.repaid)}</dd></div>
        ${hasCarry ? `<div><dt>其中已省略明细</dt><dd>${repaidText(s.carry)}</dd></div>` : ''}
        <div><dt>相对均摊</dt><dd>${luckText(s)}</dd></div>
        <div class="net"><dt>余额</dt><dd class="${s.net > 0 ? 'in' : s.net < 0 ? 'out' : ''}">${netText(s.net)}</dd></div>
      </dl></section>`;
    }).join('')}</div>
    ${hasCarry ? '<p class="hint">已省略还款按每位成员的净额保留，并与可见明细合并计算；无法据此还原历史总付款或总收款。</p>' : ''}
    <div class="h2">${temporaryMode ? '临时账本' : '账本'} <span>${temporaryMode ? '仅最近一笔' : room.history.length + ' 笔消费'}</span></div>
    ${histHtml}
    ${room.repayments.length ? `<div class="h2">还款记录 <span>${temporaryMode ? '仅最近一条明细' : room.repayments.length + ' 笔 · 不计入消费'}</span></div>${repaymentsHtml}` : ''}
    <aside class="recovery-reminder" aria-label="身份恢复提醒">
      <p>${me.recoveryCode ? '请私下保存你的个人恢复码。换设备或退出后，需要它才能回到同一身份。' : '你的旧身份还没有恢复码。请先在设置中生成并保存，以免退出后无法找回。'}</p>
      <button class="btn ghost small" id="a-recovery">${me.recoveryCode ? '保存恢复码' : '生成恢复码'}</button>
    </aside>
    `}
    </div>
    <nav class="room-nav" aria-label="房间页面">
      ${[['dice', '投骰子分账', '开账 · 掷骰'], ['ledger', '记账汇总', '结算 · 账本']].map(([page, label, hint]) => {
        const status = roomPageStatus(page);
        return `<button id="nav-${page}" data-room-page="${page}" ${roomPage === page ? 'aria-current="page"' : ''} aria-controls="room-page">
          <span>${label}</span><span class="nav-status ${status.startsWith('待') ? 'attention' : ''}">${status || hint}</span></button>`;
      }).join('')}
    </nav>
  `;
  bindRoomEvents();
  if (!$modal.firstElementChild && focusId) document.getElementById(focusId)?.focus({ preventScroll: true });
  window.scrollTo({ top: scrollY, behavior: 'instant' });
}

function bindRoomEvents() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
  const act = (body) => api('/api/action', { code: me.code, token: me.token, ...body })
    .catch((e) => { if (e.message.includes('失效')) leaveRoom(e.message); else toast(e.message); });

  on('a-invite', async () => {
    const link = location.origin + '/#' + room.code;
    const text = `【骰子分账】房间码 ${room.code}，点这里加入：${link}`;
    try {
      if (navigator.share) { await navigator.share({ title: '骰子分账', text }); return; }
      await navigator.clipboard.writeText(text);
      toast('邀请已复制，去微信粘贴给 TA');
    } catch (e) { toast('复制失败，手动输入房间码吧: ' + room.code); }
  });
  $app.querySelectorAll('[data-room-page]').forEach((button) => button.addEventListener('click', () => switchRoomPage(button.dataset.roomPage)));
  on('a-ledger-pending', () => switchRoomPage('ledger', true));
  on('a-view-ledger', () => switchRoomPage('ledger', true));
  on('a-dice-pending', () => switchRoomPage('dice', true));
  on('a-new', () => openBillSheet());
  on('a-repay', () => openRepaymentSheet());
  on('a-settings', () => openSettings());
  on('a-recovery', () => openSettings(me.recoveryCode ? 's-recovery' : 's-recovery-reset'));
  $app.querySelectorAll('[data-history]').forEach((el) => el.addEventListener('toggle', () => {
    if (!el.isConnected) return;
    if (el.open) expandedHistory.add(el.dataset.history); else expandedHistory.delete(el.dataset.history);
  }));
  const proposalId = room.ledgerPending?.id;
  on('l-approve', () => act({ type: 'ledgerRespond', proposalId, approve: true }));
  on('l-reject', () => act({ type: 'ledgerRespond', proposalId, approve: false }));
  on('l-withdraw', () => act({ type: 'ledgerWithdraw', proposalId }));

  on('a-roll', () => {
    rollAnimUntil = Date.now() + 1300;
    if (animTimer) clearTimeout(animTimer);
    animTimer = setTimeout(render, 1350); // 动画结束后刷新显示真点数
    render();
    act({ type: 'roll' }).then((d) => { if (d && d.roll) { myLocalRoll = d.roll; render(); } });
  });
  const billProposalId = room.bill?.pending?.id;
  on('a-reroll', () => { act({ type: 'reroll', proposalId: billProposalId }); });
  on('a-confirm', () => act({ type: 'confirm' }));
  on('a-void', () => { act({ type: 'void', proposalId: billProposalId }); });
  on('a-approve', () => act({ type: 'respond', proposalId: billProposalId, approve: true }));
  on('a-reject', () => act({ type: 'respond', proposalId: billProposalId, approve: false }));
  on('a-withdraw', () => act({ type: 'withdraw', proposalId: billProposalId }));
  document.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => {
    if (ledgerBusy()) return;
    if (confirm(temporaryMode ? '提议删除这笔临时分账及其还款？所有成员同意后清理记录与还款净额汇总，余额归零。' : '提议删除这条消费？所有成员同意后才会删除并重算余额。')) act({ type: 'deleteHistory', id: b.dataset.del });
  }));
  document.querySelectorAll('[data-del-repayment]').forEach((b) => b.addEventListener('click', () => {
    if (ledgerBusy()) return;
    if (confirm('提议删除这条还款？付款人与收款人同意后将撤销这笔余额抵扣。')) act({ type: 'deleteRepayment', id: b.dataset.delRepayment });
  }));
}

/* ============ 记一笔弹层 ============ */
let billForm = { amount: '', note: '', payer: '', participants: [] };

function parseCents(value) {
  value = value.trim();
  if (!/^(?:\d+(?:\.\d{0,2})?|\.\d{1,2})$/.test(value)) return null;
  const cents = Math.round(Number(value) * 100);
  return Number.isSafeInteger(cents) && cents > 0 ? cents : null;
}
function openBillSheet() {
  if (ledgerBusy() || memberIds().length < 2) return;
  billForm = { amount: '', note: '', payer: me.role, participants: memberIds() };
  renderBillSheet();
}

function renderBillSheet() {
  const P = room.players;
  $modal.innerHTML = `
    <div class="mask" id="mask">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bill-title">
        <h3 id="bill-title">记一笔，让骰子决定</h3>
        <label for="b-amount">消费总金额（元）</label>
        <div class="amt-input"><span class="yen" aria-hidden="true">¥</span>
          <input type="text" inputmode="decimal" id="b-amount" placeholder="0.00" value="${esc(billForm.amount)}"></div>
        ${temporaryMode ? '<p class="hint">开掷时所有已加入的成员都需确认（包括不参与分摊的人）。确认入账后，旧分账、还款及还款净额汇总会被替换，余额只计算新的一笔。</p>' : '<p class="hint">仅本次参与者需要掷骰与确认。未参与者可以旁观。</p>'}
        <label for="b-note">备注（选填，比如：晚饭 · 火锅）</label>
        <input type="text" id="b-note" maxlength="30" placeholder="这顿是干啥的" value="${esc(billForm.note)}">
        <fieldset><legend>谁来分摊？至少两人，发起人必须参与</legend>
          <div class="participant-picker">${memberIds().map((id) => `<label>
            <input type="checkbox" data-participant="${esc(id)}" ${billForm.participants.includes(id) ? 'checked' : ''} ${id === me.role ? 'disabled' : ''}>
            <span>${ph(P[id], id)}${id === me.role ? '（我，必选）' : ''}</span></label>`).join('')}</div>
        </fieldset>
        <label for="b-payer">谁先垫付？仅可选择本次参与者</label>
        <select id="b-payer"></select>
        <p class="hint" id="b-count" role="status"></p>
        <button class="btn" id="b-go">开掷</button>
        <button class="btn plain" id="b-cancel">先不记了</button>
      </div>
    </div>`;
  const amt = document.getElementById('b-amount'), payer = document.getElementById('b-payer');
  const syncPayers = () => {
    if (!billForm.participants.includes(billForm.payer)) billForm.payer = me.role;
    payer.innerHTML = billForm.participants.map((id) => `<option value="${esc(id)}" ${id === billForm.payer ? 'selected' : ''}>${ph(P[id], id)}</option>`).join('');
    document.getElementById('b-count').textContent = `已选择 ${billForm.participants.length} 人；开始后名单锁定。`;
    document.getElementById('b-go').disabled = billForm.participants.length < 2;
  };
  syncPayers();
  amt.addEventListener('input', (e) => { billForm.amount = e.target.value; });
  document.getElementById('b-note').addEventListener('input', (e) => { billForm.note = e.target.value; });
  payer.addEventListener('change', (e) => { billForm.payer = e.target.value; });
  $modal.querySelectorAll('[data-participant]').forEach((input) => input.addEventListener('change', () => {
    billForm.participants = Array.from($modal.querySelectorAll('[data-participant]')).filter((el) => el.checked).map((el) => el.dataset.participant);
    syncPayers();
  }));
  document.getElementById('b-cancel').addEventListener('click', closeModal);
  document.getElementById('b-go').addEventListener('click', async (e) => {
    if (ledgerBusy()) { toast('有分账或账本提议正在进行，请稍后再记'); return; }
    const cents = parseCents(billForm.amount), participants = [...new Set(billForm.participants)];
    if (cents === null) { toast('请输入大于零的金额，最多两位小数'); amt.focus(); return; }
    if (participants.length < 2 || !participants.includes(me.role) || !participants.includes(billForm.payer) || participants.some((id) => !room.players[id])) {
      toast('至少选择两人，且必须包括你和垫付人'); return;
    }
    const button = e.currentTarget;
    button.disabled = true;
    try {
      await api('/api/action', { code: me.code, token: me.token, type: 'start',
        amountCents: cents, note: billForm.note, payer: billForm.payer, participants });
      closeModal(); rollAnimUntil = 0;
    } catch (err) { button.disabled = false; toast(err.message); }
  });
  setupModal('b-amount');
}

function repaymentPair(counterpart) {
  const net = room.balance[me.role] || 0;
  const from = net < 0 ? me.role : counterpart, to = net < 0 ? counterpart : me.role;
  const amount = Math.min(1000000000, -(room.balance[from] || 0), room.balance[to] || 0);
  return { from, to, amount: Math.max(0, amount) };
}
function openRepaymentSheet() {
  if (ledgerBusy()) return;
  const net = room.balance[me.role] || 0;
  const counterparts = memberIds().filter((id) => id !== me.role && (net < 0 ? room.balance[id] > 0 : net > 0 && room.balance[id] < 0));
  if (!counterparts.length) { toast('目前没有可记录还款的对象'); return; }
  $modal.innerHTML = `
    <div class="mask" id="mask">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="repay-title">
        <h3 id="repay-title">记录已发生的还款</h3>
        <label for="repay-counterpart">${net < 0 ? '我已还给谁？' : '谁已还给我？'}仅显示余额方向相反的成员</label>
        <select id="repay-counterpart">${counterparts.map((id) => `<option value="${esc(id)}">${ph(room.players[id], id)} · ${esc(netText(room.balance[id]))}</option>`).join('')}</select>
        <p class="hint" id="repay-direction"></p>
        <label for="repay-amount" id="repay-limit"></label>
        <div class="amt-input"><span class="yen" aria-hidden="true">¥</span>
          <input type="text" inputmode="decimal" id="repay-amount" aria-describedby="repay-limit"></div>
        <button class="btn ghost small" id="repay-all" style="margin:10px auto">填入本次可还上限</button>
        <p class="hint">可只还一部分，最多为付款人应付与收款人应收的较小值。仅双方确认后抵扣余额。<br>这里只记账，不发起真实转账。</p>
        <button class="btn" id="repay-go">提交给对方确认</button>
        <button class="btn plain" id="repay-cancel">取消</button>
      </div>
    </div>`;
  const input = document.getElementById('repay-amount'), select = document.getElementById('repay-counterpart');
  const update = () => {
    const pair = repaymentPair(select.value);
    input.value = (pair.amount / 100).toFixed(2);
    document.getElementById('repay-limit').textContent = `还款金额（元）· 本次最多 ¥ ${fmt(pair.amount)}`;
    document.getElementById('repay-direction').textContent = `${memberName(pair.from)} → ${memberName(pair.to)}`;
  };
  update();
  select.addEventListener('change', update);
  document.getElementById('repay-all').addEventListener('click', update);
  document.getElementById('repay-cancel').addEventListener('click', closeModal);
  document.getElementById('repay-go').addEventListener('click', async (e) => {
    if (ledgerBusy()) { toast('请等待当前分账或账本提议完成'); return; }
    const { from, to, amount } = repaymentPair(select.value), cents = parseCents(input.value);
    if (cents === null || cents > amount || !room.players[from] || !room.players[to]) {
      toast('请输入大于零、不超过本次可还上限的金额，最多两位小数'); input.focus(); return;
    }
    const button = e.currentTarget;
    button.disabled = true;
    try {
      await api('/api/action', { code: me.code, token: me.token, type: 'repay', from, to, amountCents: cents });
      closeModal(); toast('已提交，等待对方核实还款');
    } catch (err) { button.disabled = false; toast(err.message); }
  });
  setupModal('repay-counterpart');
}

  $modal.innerHTML = `
    <div class="mask" id="mask">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <h3 id="settings-title">房间设置</h3>
        <label for="s-name">我的昵称</label>
        <input type="text" id="s-name" maxlength="12" value="${esc(P[r].name)}">
        <fieldset><legend>我的头像</legend>
          <div class="avatars" id="s-avs">${AVATARS.map((a, i) =>
            `<button data-av="${esc(a)}" aria-label="头像 ${i + 1}" aria-pressed="${P[r].avatar === a}" class="${P[r].avatar === a ? 'on' : ''}">${esc(a)}</button>`).join('')}</div>
        </fieldset>
        <fieldset><legend>骰子面数 · 每人掷 1–N 点</legend>
          <div class="chips" id="s-faces">${[4, 6, 8, 10, 12, 20].map((f) =>
            `<button data-faces="${f}" aria-pressed="${(room.faces || 6) === f}" class="${(room.faces || 6) === f ? 'on' : ''}" ${ledgerBusy() ? 'disabled' : ''}>${f}面</button>`).join('')}</div>
        </fieldset>
        <h4>个人身份与恢复</h4>
        <p class="hint">房间码 <b>${esc(room.code)}</b> · 成员编号 <b>${esc(r)}</b><br>编号不会随昵称或设备改变。恢复身份只需房间码和你自己的恢复码。</p>
        <label for="s-recovery">我的恢复码 · 请保密，不要发到群里</label>
        <input type="text" id="s-recovery" class="recovery-code" readonly value="${esc(me.recoveryCode || '')}" placeholder="此设备尚无恢复码，请先生成" autocomplete="off" spellcheck="false">
        <div id="s-recovery-actions">
          <div class="button-row">
            <button class="btn ghost small" id="s-recovery-copy" ${me.recoveryCode ? '' : 'disabled'}>复制恢复码</button>
            <button class="btn ghost small" id="s-recovery-save" ${me.recoveryCode ? '' : 'disabled'}>保存恢复文件</button>
          </div>
          <div class="button-row" style="margin-top:12px">
            <button class="btn plain small" id="s-recovery-reset">${me.recoveryCode ? '重置恢复码' : '生成个人恢复码'}</button>
            <button class="btn plain small" id="s-recovery-custom">自定义</button>
          </div>
        </div>
        <div id="s-recovery-edit" hidden>
          <p class="hint" id="s-recovery-hint">请输入 8 位数字，可用 0 开头。请避免生日、连续或重复数字。</p>
          <div class="button-row">
            <button class="btn small" id="s-recovery-custom-save">覆盖保存</button>
            <button class="btn plain small" id="s-recovery-cancel">取消</button>
          </div>
        </div>
        <p class="hint">旧恢复码继续有效，覆盖或重置后旧码立即失效，请重新保存。恢复身份会使原设备登录失效，请私下保管此码。${temporaryMode ? '<br>临时房间若已销毁，恢复码也无法找回房间或账本。' : ''}</p>
        <h4>账本管理</h4>
        <p class="hint">清空消费、还款明细和还款净额汇总，需要所有已加入的成员同意。</p>
        <div class="button-row">
          <button class="btn danger small" id="s-clear" ${ledgerBusy() || !hasRecords ? 'disabled' : ''}>提议清空账本</button>
          <button class="btn plain small" id="s-leave">退出房间</button>
        </div>
        <p class="hint">退出会清除本机身份。请先保存恢复码；「加入房间」只会创建新成员，不能找回原身份。</p>
        <button class="btn plain" id="s-close">关闭</button>
      </div>
    </div>`;
  let avatar = P[r].avatar;
  const identity = me;
  const save = async () => {
    const name = document.getElementById('s-name').value.trim();
    try { await api('/api/action', { code: identity.code, token: identity.token, type: 'setMe', name, avatar }); } catch (e) { toast(e.message); }
  };
  document.getElementById('s-name').addEventListener('change', save);
  $modal.querySelectorAll('#s-avs button').forEach((b) => b.addEventListener('click', () => {
    avatar = b.dataset.av;
    $modal.querySelectorAll('#s-avs button').forEach((x) => {
      x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b));
    });
    save();
  }));
  $modal.querySelectorAll('#s-faces button').forEach((b) => b.addEventListener('click', () => {
    if (ledgerBusy()) return;
    const f = Number(b.dataset.faces), cur = room.faces || 6;
    if (f === cur) return;
    const setOn = (v) => $modal.querySelectorAll('#s-faces button').forEach((x) => {
      const selected = Number(x.dataset.faces) === v;
      x.classList.toggle('on', selected); x.setAttribute('aria-pressed', String(selected));
    });
    setOn(f);
    api('/api/action', { code: identity.code, token: identity.token, type: 'setFaces', faces: f })
      .catch((e) => { setOn(cur); toast(e.message); });
  }));
  const recoveryInput = document.getElementById('s-recovery');
  recoveryInput.addEventListener('click', () => { if (recoveryInput.readOnly) recoveryInput.select(); });
  document.getElementById('s-recovery-copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(identity.recoveryCode); toast('个人恢复码已复制，请私下保存'); }
    catch (e) { document.getElementById('s-recovery')?.select(); toast('无法自动复制，请手动复制已选中的恢复码'); }
  });
  document.getElementById('s-recovery-save').addEventListener('click', () => {
    const text = `骰子分账 · 个人恢复凭据（请保密）\n服务器：${location.origin}\n房间码：${identity.code}\n成员编号：${identity.role}\n恢复码：${identity.recoveryCode}\n\n在首页选择「恢复身份」，输入房间码与恢复码。恢复将使原设备登录失效。\n临时房间已销毁时无法恢复。重置恢复码后请更新此文件。\n`;
    const url = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
    const link = document.createElement('a');
    link.href = url; link.download = `dice-split-${identity.code}-${identity.role}-recovery.txt`;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('已请求下载，请确认保存恢复文件');
  });
  const recoveryReset = document.getElementById('s-recovery-reset');
  const recoveryCustom = document.getElementById('s-recovery-custom');
  const recoverySave = document.getElementById('s-recovery-custom-save');
  const recoveryCancel = document.getElementById('s-recovery-cancel');
  const recoveryButtons = [recoveryReset, recoveryCustom, recoverySave, recoveryCancel];
  let recoveryBusy = false;
  const setRecoveryEditing = (editing) => {
    recoveryInput.readOnly = !editing;
    recoveryInput.value = editing && !/^[0-9]{8}$/.test(identity.recoveryCode || '') ? '' : identity.recoveryCode || '';
    recoveryInput.placeholder = editing ? '输入 8 位数字' : '此设备尚无恢复码，请先生成';
    for (const [name, value] of Object.entries({ maxlength: '8', inputmode: 'numeric', pattern: '[0-9]{8}', 'aria-describedby': 's-recovery-hint' })) {
      if (editing) recoveryInput.setAttribute(name, value);
      else recoveryInput.removeAttribute(name);
    }
    document.getElementById('s-recovery-actions').hidden = editing;
    document.getElementById('s-recovery-edit').hidden = !editing;
    recoveryReset.textContent = identity.recoveryCode ? '重置恢复码' : '生成个人恢复码';
    document.getElementById('s-recovery-copy').disabled = !identity.recoveryCode;
    document.getElementById('s-recovery-save').disabled = !identity.recoveryCode;
  };
  setRecoveryEditing(false);
  recoveryCustom.addEventListener('click', () => {
    if (recoveryBusy) return;
    setRecoveryEditing(true); recoveryInput.focus(); recoveryInput.select();
  });
  recoveryCancel.addEventListener('click', () => {
    if (recoveryBusy) return;
    setRecoveryEditing(false); recoveryCustom.focus();
  });
  const updateRecovery = async (recoveryCode) => {
    if (recoveryBusy) return;
    if (identity.recoveryCode && !confirm('更换会立即作废旧恢复码。请在更换后重新复制或保存，继续吗？')) return;
    recoveryBusy = true;
    recoveryButtons.forEach((button) => { button.disabled = true; });
    recoveryInput.disabled = true;
    try {
      const d = await api('/api/recovery', { code: identity.code, token: identity.token, ...(recoveryCode === undefined ? {} : { recoveryCode }) });
      if (me !== identity) return;
      me.recoveryCode = d.recoveryCode; saveMe();
      renderRoom(); setRecoveryEditing(false);
      toast('恢复码已更新，请重新保存');
    } catch (err) { toast(err.message); }
    finally {
      recoveryBusy = false;
      recoveryButtons.forEach((button) => { button.disabled = false; });
      recoveryInput.disabled = false;
      if (me === identity) recoveryInput.focus();
    }
  };
  recoveryReset.addEventListener('click', () => { if (recoveryInput.readOnly) return updateRecovery(); });
  recoverySave.addEventListener('click', () => {
    if (recoveryBusy || recoveryInput.readOnly) return;
    if (!/^[0-9]{8}$/.test(recoveryInput.value)) {
      toast('恢复码必须是 8 位数字'); recoveryInput.focus(); return;
    }
    return updateRecovery(recoveryInput.value);
  });
  document.getElementById('s-clear').addEventListener('click', function () {
    if (ledgerBusy()) { toast('请等待当前分账或账本提议完成'); return; }
    if (!confirm('提议清空全部消费、还款记录和还款净额汇总？所有成员同意后余额归零，记录不可恢复。')) return;
    this.disabled = true;
    api('/api/action', { code: identity.code, token: identity.token, type: 'clearHistory' })
      .then(() => { closeModal(); toast('清空提议已发送，等待所有成员同意'); })
      .catch((e) => { this.disabled = false; toast(e.message); });
  });
  document.getElementById('s-leave').addEventListener('click', () => {
    const warning = '退出会清除本机身份，回到原成员必须使用已保存的个人恢复码。加入房间不会恢复原身份。'
      + (!me.recoveryCode ? '你尚未生成恢复码，建议取消并先生成、保存。' : '请确认你已私下保存恢复码。')
      + (temporaryMode ? '最后一人断开或服务重启会立即销毁临时房间；销毁后即使有恢复码也无法找回。' : '')
      + '确定退出？';
    if (confirm(warning)) leaveRoom();
  });
  document.getElementById('s-close').addEventListener('click', closeModal);
  setupModal(initialFocus);
}

let modalReturnFocus = '';
function setupModal(initialFocus) {
  if (!$modal.contains(document.activeElement) && document.activeElement?.id) modalReturnFocus = document.activeElement.id;
  const mask = document.getElementById('mask');
  mask.addEventListener('click', (e) => { if (e.target === mask) closeModal(); });
  mask.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
    if (e.key !== 'Tab') return;
    const els = Array.from(mask.querySelectorAll('button:not(:disabled), input:not(:disabled), select:not(:disabled), [tabindex="0"]'));
    if (!els.length) return;
    const first = els[0], last = els[els.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  const target = document.getElementById(initialFocus);
  setTimeout(() => { if (target?.isConnected) target.focus(); }, 100);
}
function closeModal() {
  $modal.innerHTML = '';
  document.getElementById(modalReturnFocus)?.focus({ preventScroll: true });
  modalReturnFocus = '';
}

/* ============ 主渲染 ============ */
function render() {
  if (!me) { renderHome(); return; }
  if (!room) { $app.innerHTML = `<div class="empty" style="padding-top:120px">连接房间中…</div>`; return; }
  // 只有阶段切换（新一笔开始/揭晓/入账）才收起弹层，避免对方上线推送打断"记一笔"输入
  const phaseKey = `${room.phase}:${room.bill ? room.bill.rerolls : ''}:${room.history.length}:${room.repayments.length}:${room.ledgerPending?.id || ''}`;
  if (phaseKey !== lastPhaseKey) { lastPhaseKey = phaseKey; closeModal(); }
  renderRoom();
}

connect();
render();
</script>
</body>
</html>
